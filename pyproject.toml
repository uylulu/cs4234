[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs4234-hierarchical-clustering"
version = "0.1.0"
description = "Hierarchical clustering experiments for CS4234"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "cvxpy>=1.6",
    "scs>=3.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyterlab>=4",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = ["ruff>=0.9", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
